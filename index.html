<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沮授语音</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <main class="stage">
        <article class="panel">
            <figure class="portrait">
                <img src="bg.jpg" alt="沮授">
            </figure>

            <section class="controls">
                <header class="heading">
                    <p class="eyebrow">三国杀 · 语音快捷键</p>
                    <h1>沮授语音</h1>
                    <p class="hint">按键盘 1–4，或点按按钮</p>
                </header>

                <div class="voice-buttons">
                    <button type="button" class="voice-btn" data-id="1" onclick="playVoice(1)">
                        <span class="key">1</span>
                        <span class="label">渐营</span>
                    </button>
                    <button type="button" class="voice-btn" data-id="2" onclick="playVoice(2)">
                        <span class="key">2</span>
                        <span class="label">渐营</span>
                    </button>
                    <button type="button" class="voice-btn" data-id="3" onclick="playVoice(3)">
                        <span class="key">3</span>
                        <span class="label">矢北</span>
                    </button>
                    <button type="button" class="voice-btn" data-id="4" onclick="playVoice(4)">
                        <span class="key">4</span>
                        <span class="label">阵亡</span>
                    </button>
                </div>

                <div class="music">
                    <button type="button" id="bgmButton" aria-pressed="false">
                        <span class="when-paused">播放背景音乐</span>
                        <span class="when-playing">暂停背景音乐</span>
                    </button>
                    <label class="volume">
                        <span>音量</span>
                        <input
                            type="range"
                            id="volumeSlider"
                            min="0"
                            max="100"
                            value="30">
                    </label>
                </div>
            </section>
        </article>
    </main>

    <script src="app.js?v=2"></script>
</body>
</html>
